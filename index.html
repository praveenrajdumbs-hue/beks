<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>A Question For You</title>
<style>
  :root{
    --ink: #1c1b29;
    --paper: #ffffff;
    --card: #ffffff;
    --accent: #5b4fff;
    --accent-dark: #4238d1;
    --line: #e7e5e0;
    --muted: #8a8794;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
  }

  body{
    font-family: -apple-system, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    background: var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  .card{
    position:relative;
    z-index:1;
    background: var(--card);
    border-radius: 20px;
    padding: 56px 44px 48px;
    max-width: 420px;
    width: 88vw;
    text-align:center;
    box-shadow: 0 20px 50px -20px rgba(28,27,41,0.18);
    border: 1px solid var(--line);
  }

  .eyebrow{
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 14px;
  }

  h1{
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 30px;
    line-height: 1.25;
    color: var(--ink);
    margin: 0 0 8px;
  }

  .sub{
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 34px;
  }

  .btn-row{
    position: relative;
    display:flex;
    gap: 16px;
    justify-content:center;
    align-items:center;
    min-height: 64px;
  }

  button{
    border:none;
    cursor:pointer;
    font-family: inherit;
    font-weight: 700;
    border-radius: 999px;
    padding: 16px 30px;
    font-size: 16px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  #yes{
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: white;
    box-shadow: 0 10px 24px -8px rgba(91,79,255,0.45);
  }
  #yes:hover{ transform: scale(1.06); }
  #yes:active{ transform: scale(0.97); }

  #no{
    background: var(--card);
    color: var(--ink);
    border: 1.5px solid var(--line);
    position: relative;
    z-index: 2;
  }

  #no.dodging{
    position: fixed;
    transition: left 0.18s ease, top 0.18s ease;
  }

  .hint{
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 16px;
    transition: opacity 0.3s ease;
  }

  /* thank-you screen */
  .thanks{
    position: fixed;
    inset: 0;
    z-index: 5;
    display:none;
    align-items:center;
    justify-content:center;
    background: var(--ink);
    text-align:center;
    padding: 20px;
  }
  .thanks.show{ display:flex; }
  .thanks-inner{
    animation: pop 0.5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop{
    0%{ transform: scale(0.6); opacity:0; }
    100%{ transform: scale(1); opacity:1; }
  }
  .thanks h2{
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 34px;
    color: white;
    margin: 0 0 10px;
  }
  .thanks p{
    color: rgba(255,255,255,0.75);
    font-size: 15px;
    max-width: 320px;
    margin: 0 auto;
  }

  .confetti{
    position:fixed;
    top:-40px;
    width: 10px;
    height: 10px;
    z-index: 6;
    pointer-events:none;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(105vh) rotate(360deg); opacity: 0.85; }
  }

  @media (prefers-reduced-motion: reduce){
    .confetti{ animation: none; display:none; }
    #no.dodging{ transition:none; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">A question</div>
  <h1>are you bekku?</h1>
  <p class="sub">Just pick one. (One of these buttons is a little shy.)</p>
  <div class="btn-row">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div class="thanks" id="thanks">
  <div class="thanks-inner">
    <h2>Yay — correct!</h2>
    <p>yeah you are, i know ;) .</p>
  </div>
</div>

<script>
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const hint = document.getElementById('hint');
  const thanks = document.getElementById('thanks');

  const hints = [
    "Getting warmer... for yes, that is.",
    "It's okay, I'll wait",
    "The other button is right there!",
    "Persistent. I like that.",
    "Okay this is impressive, but still — yes?"
  ];
  let hintIndex = 0;
  let dodges = 0;

  function moveNoButton(){
    const btnW = noBtn.offsetWidth || 90;
    const btnH = noBtn.offsetHeight || 50;
    const margin = 16;
    const maxX = window.innerWidth - btnW - margin;
    const maxY = window.innerHeight - btnH - margin;

    const newX = Math.max(margin, Math.random() * maxX);
    const newY = Math.max(margin, Math.random() * maxY);

    noBtn.classList.add('dodging');
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';

    dodges++;
    hint.textContent = hints[Math.min(hintIndex, hints.length - 1)];
    if (dodges % 2 === 0 && hintIndex < hints.length - 1) hintIndex++;

    const scale = Math.min(1.35, 1 + dodges * 0.045);
    yesBtn.style.transform = `scale(${scale})`;
  }

  noBtn.addEventListener('mouseenter', moveNoButton);
  noBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    moveNoButton();
  }, { passive: false });
  noBtn.addEventListener('click', function(e){
    e.preventDefault();
    moveNoButton();
  });

  function burstConfetti(){
    const colors = ['#5b4fff', '#4238d1', '#1c1b29', '#c9c6ff'];
    for(let i = 0; i < 30; i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      const size = 6 + Math.random() * 8;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }
  }

  yesBtn.addEventListener('click', function(){
    thanks.classList.add('show');
    burstConfetti();
  });

  window.addEventListener('resize', function(){
    if(noBtn.classList.contains('dodging')){
      moveNoButton();
    }
  });
</script>

</body>
</html>
